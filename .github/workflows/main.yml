
name: Build AC Remote Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android project
        shell: bash
        run: |
          test -f settings.gradle || {
            echo "::error::settings.gradle not found at repository root"
            exit 1
          }
          test -f app/build.gradle || {
            echo "::error::app/build.gradle not found"
            exit 1
          }
          test -f gradlew || {
            echo "::error::gradlew not found at repository root"
            exit 1
          }
          test -f gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::Gradle wrapper JAR is missing"
            exit 1
          }
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK missing or empty: $APK"
            find . -path '*/build/outputs/apk/*' -type f
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AC-Remote-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
